services:
  cvat_ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    labels:
      traefik.enable: "true"
      traefik.http.services.cvat-ui.loadbalancer.server.port: "80"
      traefik.http.routers.cvat-ui.rule: "PathPrefix(`/`)"
      traefik.http.routers.cvat-ui.entrypoints: "web"
      traefik.http.routers.cvat-ui.priority: "1"
      traefik.http.routers.cvat-ui-ext.rule: "Host(`home.hawk.lc`)"
      traefik.http.routers.cvat-ui-ext.entrypoints: web
      traefik.http.routers.cvat-ui-ext.service: cvat-ui
    volumes:
      - ./cvat-ui-default.conf:/etc/nginx/conf.d/default.conf:ro

  traefik:
    ports:
      - 8082:8080
      - 8090:8090

  cvat_server:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
      EMAIL_HOST: "smtp.ncu.edu.cn"
      EMAIL_PORT: "465"
      EMAIL_HOST_USER: "hawklee@ncu.edu.cn"
      EMAIL_HOST_PASSWORD: "Wux5xUuKRveY8XmI"
      EMAIL_USE_SSL: "yes"
      EMAIL_USE_TLS: "no"
      DEFAULT_FROM_EMAIL: "hawklee@ncu.edu.cn"
      UI_URL: "https://cvat.aiia.one"
      CVAT_SHARE_URL: "Mounted from /app/dataset/MetaQual2025"
      ALLOWED_HOSTS: "cvat.aiia.one,home.hawk.lc,192.168.8.6,localhost,cvat-server,*"
      LANGUAGE_CODE: "zh-Hans"
      CVAT_SERVERLESS: 1
    labels:
      traefik.enable: "true"
      traefik.http.services.cvat.loadbalancer.server.port: "8080"
      traefik.http.routers.cvat.rule: "PathPrefix(`/api/`) || PathPrefix(`/static/`) || PathPrefix(`/admin`) || PathPrefix(`/django-rq`) || PathPrefix(`/analytics`)"
      traefik.http.routers.cvat.entrypoints: "web"
      traefik.http.routers.cvat.priority: "100"
      traefik.http.routers.cvat-ext.rule: "Host(`home.hawk.lc`) && (PathPrefix(`/api/`) || PathPrefix(`/static/`) || PathPrefix(`/admin`) || PathPrefix(`/django-rq`))"
      traefik.http.routers.cvat-ext.entrypoints: web
      traefik.http.routers.cvat-ext.service: cvat
    volumes:
      - ./cvat/settings/base.py:/home/django/cvat/settings/base.py:ro
      - /app/dataset/MetaQual2025:/home/django/share:ro
      - ./cvat/apps/engine/rules/jobs.rego:/home/django/cvat/apps/engine/rules/jobs.rego:ro
      - ./cvat/apps/engine/serializers.py:/home/django/cvat/apps/engine/serializers.py:ro

  cvat_worker_annotation:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &email_env
      EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
      EMAIL_HOST: "smtp.ncu.edu.cn"
      EMAIL_PORT: "465"
      EMAIL_HOST_USER: "hawklee@ncu.edu.cn"
      EMAIL_HOST_PASSWORD: "Wux5xUuKRveY8XmI"
      EMAIL_USE_SSL: "yes"
      EMAIL_USE_TLS: "no"
      DEFAULT_FROM_EMAIL: "hawklee@ncu.edu.cn"
      UI_URL: "https://cvat.aiia.one"
      LANGUAGE_CODE: "zh-Hans"
      CVAT_SERVERLESS: 1
    volumes: &settings_vol
      - ./cvat/settings/base.py:/home/django/cvat/settings/base.py:ro
      - /app/dataset/MetaQual2025:/home/django/share:ro
      - ./cvat/apps/engine/rules/jobs.rego:/home/django/cvat/apps/engine/rules/jobs.rego:ro
      - ./cvat/apps/engine/serializers.py:/home/django/cvat/apps/engine/serializers.py:ro
  
  cvat_worker_export:
    environment: *email_env
    volumes: *settings_vol
  cvat_worker_import:
    environment: *email_env
    volumes: *settings_vol
  cvat_worker_quality_reports:
    environment: *email_env
    volumes: *settings_vol
  cvat_worker_webhooks:
    environment: *email_env
    volumes: *settings_vol
  cvat_worker_chunks:
    volumes: *settings_vol
  cvat_worker_consensus:
    volumes: *settings_vol
  cvat_worker_utils:
    volumes: *settings_vol

  cvat_clickhouse:
    volumes:
      - ./clickhouse_tuning.xml:/etc/clickhouse-server/config.d/tuning.xml:ro

  dataset_server:
    image: nginx:alpine
    container_name: dataset_server
    restart: always
    volumes:
      - /app/dataset/MetaQual2025:/data:ro
      - ./dataset_nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dataset_htpasswd:/etc/nginx/.htpasswd:ro
      - /app/Cable-Protection-System/construction_videos:/construction_videos:ro
      - /app/Cable-Protection-System/dataset:/dataset:ro
    ports:
      - "28081:80"
    networks:
      - cvat
    labels:
      traefik.enable: "true"
      traefik.http.services.dataset.loadbalancer.server.port: "80"
      traefik.http.routers.dataset.rule: "Host(`cvat.aiia.one`) && PathPrefix(`/dataset`)"
      traefik.http.routers.dataset.entrypoints: web
      traefik.http.routers.dataset.priority: "100"
      traefik.http.middlewares.dataset-strip.stripprefix.prefixes: "/dataset"
      traefik.http.routers.dataset.middlewares: "dataset-strip"
      traefik.http.routers.dataset-ext.rule: "Host(`home.hawk.lc`) && PathPrefix(`/dataset`)"
      traefik.http.routers.dataset-ext.entrypoints: web
      traefik.http.routers.dataset-ext.priority: "100"
      traefik.http.routers.dataset-ext.service: dataset

volumes:
  cvat_share:
    driver_opts:
      type: none
      device: /app/dataset/MetaQual2025
      o: bind
