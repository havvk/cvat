# docker-compose.override.yml

# 1. 定义一个可复用的环境配置锚点
x-cvat-environment: &cvat-environment
  environment:
    # --- 基础配置 ---
    ALLOWED_HOSTS: "<your_external_domain>,<your_lan_ip>,localhost,cvat-server"

    # --- 语言配置 ---
    LANGUAGE_CODE: "zh-Hans"

    # --- 邮件服务配置 ---
    EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
    EMAIL_HOST: "your.smtp.server.com"
    EMAIL_PORT: 587
    EMAIL_HOST_USER: "your-email@example.com"
    EMAIL_HOST_PASSWORD: "your-generated-email-auth-code"
    EMAIL_USE_TLS: "True"
    DEFAULT_FROM_EMAIL: "your-email@example.com"

services:
  cvat_ui:
    volumes:
      - ./cvat-ui-default.conf:/etc/nginx/conf.d/default.conf:ro

  cvat_server:
    <<: *cvat-environment # 应用通用环境配置
    volumes:
      - cvat_share:/home/django/share:ro

  cvat_worker_import:
    <<: *cvat-environment
    volumes:
      - cvat_share:/home/django/share:ro

  cvat_worker_export:
    <<: *cvat-environment
    volumes:
      - cvat_share:/home/django/share:ro

  cvat_worker_annotation:
    <<: *cvat-environment
    volumes:
      - cvat_share:/home/django/share:ro

  cvat_worker_chunks:
    <<: *cvat-environment
    volumes:
      - cvat_share:/home/django/share:ro

  # 为 docker-compose.dev.yml 中定义的所有其他 worker 也应用配置
  cvat_worker_utils:
    <<: *cvat-environment
  cvat_worker_quality_reports:
    <<: *cvat-environment
  cvat_worker_consensus:
    <<: *cvat-environment
  cvat_worker_webhooks:
    <<: *cvat-environment

  cvat_clickhouse:
    volumes:
      # 将自定义的调优配置挂载到 ClickHouse 的配置目录中
      - ./clickhouse_tuning.xml:/etc/clickhouse-server/config.d/tuning.xml:ro

volumes:
  cvat_share:
    driver_opts:
      type: none
      device: /app/dataset # 这里使用你实际的路径
      o: bind
