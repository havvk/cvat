metadata:
  name: pth-facebookresearch-sam2-hiera-large
  namespace: cvat
  annotations:
    # --- 关键修改：将所有复杂信息扁平化为字符串 ---

    # 将模型在UI中显示的名称作为'name'
    name: "Segment Anything 2.1"

    # 'type' 保持为字符串
    type: "interactor"

    # 将所有其他元信息，特别是'spec'对象，序列化为一个JSON字符串
    # 并赋值给 'spec' 这个 annotation key
    spec: |
      {
        "min_pos_points": 0,
        "min_neg_points": 0,
        "startswith_box_optional": true,
        "version": 2,
        "animated_gif": "https://raw.githubusercontent.com/cvat-ai/cvat/develop/site/content/en/images/hrnet_example.gif",
        "help_message": "The interactor allows to get a mask of an object using at least one positive, and any negative points inside it"
      }

spec:
  description: Interactive object segmentation with Segment-Anything 2.1
  runtime: 'python:3.8' # 保持不变，这指定了 nuclio 使用哪个 python runtime
  handler: main:handler
  eventTimeout: 30s
  # env 里的 PYTHONPATH 已经在基础镜像中设置，但这里保留也无妨
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam2

  build:
    # --- 关键修改部分 ---
    # 1. 定义最终的函数镜像名
    image: cvat.pth.facebookresearch.sam2.hiera_large:latest-gpu
    # 2. 指定我们预构建的基础镜像
    baseImage: sam2-hiera-large-base
    # 3. 移除所有 buildArgs 和 directives
    #    因为所有构建步骤都已在基础镜像中完成
    # ----------------------

  triggers:
    myHttpTrigger:
      maxWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB
  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
