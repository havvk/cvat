metadata:
  annotations:
    framework: pytorch
    name: YOLOv8-Seg Defect Expert
    spec: '[{"name": "inclusion", "attributes": []}, {"name": "pit", "attributes":
      []}]'
    type: detector
  name: yolov8-seg-defect-expert
  namespace: cvat
spec:
  build:
    baseImage: sam3-tracker-base:latest
    directives:
      preCopy:
      - kind: USER
        value: root
      - kind: ENV
        value: HTTP_PROXY="http://172.17.0.1:8118" HTTPS_PROXY="http://172.17.0.1:8118"
          http_proxy="http://172.17.0.1:8118" https_proxy="http://172.17.0.1:8118"
      - kind: RUN
        value: pip install -i https://pypi.tuna.tsinghua.edu.cn/simple --no-cache-dir
          ultralytics numpy==1.24.4 scikit-image==0.24.0 opencv-python-headless==4.8.0.76
      - kind: ENV
        value: HTTP_PROXY="" HTTPS_PROXY="" http_proxy="" https_proxy=""
      - kind: WORKDIR
        value: /opt/nuclio
    image: cvat.pth.ultralytics.yolov8seg.defect.gpu
  description: Detects inclusions and small pits using a specialized YOLOv8 segmentation
    model
  env:
  - name: MODEL_WEIGHT_PATH
    value: /app/model/best.pt
  eventTimeout: 60s
  handler: main:handler
  resources:
    limits:
      nvidia.com/gpu: 1
  runtime: python:3.10
  triggers:
    myHttpTrigger:
      attributes:
        maxRequestBodySize: 33554432
      kind: http
      maxWorkers: 1
      workerAvailabilityTimeoutMilliseconds: 10000
  volumes:
  - volume:
      hostPath:
        path: /app/models/Defect-Expert-Final-2560-b4-Run35/weights
      name: defect-model-weights
    volumeMount:
      mountPath: /app/model
      name: defect-model-weights
